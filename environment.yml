# Conda environment for FPR2 virtual screening benchmark
# Usage: conda env create -f environment.yml
#
# NOTE: Uni-Dock requires separate installation:
#   conda install -c conda-forge unidock
# Uni-Dock also requires NVIDIA GPU with CUDA >= 12.0
# Tested with: 2x RTX 4500 Ada (24 GB), CUDA 12.9, Uni-Dock 1.1.3

name: vina_dock
channels:
  - conda-forge
  - omnia
dependencies:
  - python=3.12
  - rdkit
  - openbabel
  - numpy
  - scipy
  - vina
  - biopython
  - unidock
  - pip
  - pip:
    - meeko==0.7.1
    - gemmi==0.7.5
    - chembl-webresource-client==0.10.9
    - scikit-learn==1.8.0
    - matplotlib==3.10.8
    - seaborn==0.13.2
    - pandas==3.0.1
